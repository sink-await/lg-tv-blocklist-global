name: Build blocklists

on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'lists/**', '.github/workflows/build.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: lists
  cancel-in-progress: false

# Workflow-file edits are covered by the paths filters above. publish is gated
# on actual src/ or scripts/ changes so workflow-only pushes don't churn lists
# (the Updated timestamp would otherwise create a bot commit every run).

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.changed.outputs.src_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect src/scripts changes
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE_SHA"
          # Fail-open: empty/all-zeros base SHA (ref creation) assumes changed,
          # as does a force-push whose unreachable base fails the diff below.
          # Worst case is one redundant publish run (timestamp-only bot commit).
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "$GITHUB_SHA" -- src/ scripts/; then
            echo "src_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject direct lists/ edits in PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA...HEAD" -- lists/ lists-regions/)"
          if [ -n "$changed" ]; then
            echo "::error::lists/ and lists-regions/ are generated by scripts/build.py and scripts/localize.py from src/ -- edit src/ instead; direct changes are rejected in PRs."
            exit 1
          fi
      - name: Validate source + compile dry-run
        run: python3 scripts/build.py check
      - name: Run test suite
        run: python3 scripts/test_build.py
      - name: Run localize tests
        run: python3 scripts/test_localize.py
      # verify.py's own tests are offline by design (classify() is pure), so
      # they run here; the network check itself is manual/scheduled, never a
      # PR gate -- LG decommissioning a host must not fail someone's PR.
      - name: Run verify tests
        run: python3 scripts/test_verify.py

  publish:
    if: github.event_name != 'pull_request' && needs.check.outputs.src_changed == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Compile lists
        run: python3 scripts/build.py build
      - name: Verify checksums
        run: cd lists && sha256sum -c SHA256SUMS
      # build.py writes lists-regions/ itself (it knows which families exist in
      # which market, so it never emits a name that NXDOMAINs there). These are
      # committed rather than gitignored: a missing directory is a 404 on a link
      # a user has already pasted into Pi-hole.
      - name: Verify per-country checksums
        run: |
          set -euo pipefail
          for d in lists-regions/*/; do (cd "$d" && sha256sum -c SHA256SUMS >/dev/null); done
          echo "checksums OK for $(ls -d lists-regions/*/ | wc -l) directories"
      - name: Commit generated lists
        run: |
          if ! git diff --quiet -- lists lists-regions README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lists/ lists-regions/ README.md
            git commit -m "chore: regenerate blocklists [skip ci]"
            git push
          fi
